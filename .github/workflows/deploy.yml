# GitHub Pages was an early, second deployment target. Production has been
# Vercel for a long time, and after the 2026-08-22 move to the team account
# this job failed on every push — GitHub Pages settings do not survive a
# repository transfer, so it tried to publish to a Pages site that does not
# exist and put a red cross on every commit.
#
# Left in place rather than deleted, but it no longer runs on push. If the
# team ever wants a Pages mirror, enable Pages in the repository settings
# and run this from the Actions tab. If nobody wants one, delete this file.
name: Deploy static content to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
