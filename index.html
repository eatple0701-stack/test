<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Meet fellow travelers in Korea, share a meal, and explore Korean culture together." />
    <meta name="theme-color" content="#FFFFFF" />
    <title>밥친구 Eatple · Don't just visit Korea. Share a Korean table.</title>
    <!-- Resolves the traveller's theme choice (or the OS default, for
         anyone who never chose) before the first paint, so there is no
         flash of the wrong theme while React boots. The only other place
         this logic lives is src/data/theme.js — keep the two in sync, and
         see that file's own comment for why this attribute is always
         written rather than sometimes left absent. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('bapchingu-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
